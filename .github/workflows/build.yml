name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: gradle build
        working-directory: umbralis
      - uses: actions/upload-artifact@v4
        with:
          name: umbralis-jar
          path: |
            umbralis/build/libs/*.jar
            !umbralis/build/libs/*-sources.jar
